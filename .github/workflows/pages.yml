# Publica el sitio en GitHub Pages, en el dominio moctlab.com.ar.
#
# Pages sirve archivos estáticos, así que acá se corre el export
# (`npm run build:pages`) y se sube la carpeta `out/`. El dominio propio se
# declara en public/CNAME, que viaja dentro del artefacto.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/quirky-lovelace-350f1c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; si llegan dos pushes juntos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build estático
        env:
          # Dominio propio: el sitio cuelga de la raíz, sin subdirectorio, así
          # que NEXT_PUBLIC_BASE_PATH queda sin definir a propósito.
          NEXT_PUBLIC_SITE_URL: https://moctlab.com.ar
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
